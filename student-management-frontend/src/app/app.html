<mat-toolbar color="primary">

  <span>
    Student Management System
  </span>

  <span class="toolbar-spacer">
  </span>

  @if (
    authService.isLoggedIn()
    ) {

    <a
      mat-button
      routerLink="/dashboard"
      routerLinkActive="active-nav"
      [routerLinkActiveOptions]="{
        exact: true
      }">

      Dashboard

    </a>

    <a
      mat-button
      routerLink="/students"
      routerLinkActive="active-nav">

      Students

    </a>

    @if (
      authService.isAdmin()
      ) {

      <a
        mat-button
        routerLink="/add-student"
        routerLinkActive="active-nav"
        [routerLinkActiveOptions]="{
          exact: true
        }">

        Add Student

      </a>

      <a
        mat-button
        routerLink="/departments"
        routerLinkActive="active-nav"
        [routerLinkActiveOptions]="{
          exact: true
        }">

        Departments

      </a>

    }

  }

  <a
    mat-button
    routerLink="/about"
    routerLinkActive="active-nav"
    [routerLinkActiveOptions]="{
      exact: true
    }">

    About

  </a>

  @if (
    !authService.isLoggedIn()
    ) {

    <a
      mat-button
      routerLink="/login"
      routerLinkActive="active-nav"
      [routerLinkActiveOptions]="{
        exact: true
      }">

      Sign In

    </a>

  }

  @if (
    authService.isLoggedIn()
    ) {

    <span class="user-info">

      {{ authService.getUsername() }}

      (
      {{ authService.getRole() }}
      )

    </span>

    <button
      mat-button
      type="button"
      (click)="logout()">

      Logout

    </button>

  }

</mat-toolbar>

<main class="page-content">

  <router-outlet>
  </router-outlet>

</main>
