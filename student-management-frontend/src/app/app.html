<mat-toolbar color="primary">

  <span>
    Student Management System
  </span>

  <span class="toolbar-spacer">
  </span>

  @if (
    authService.isLoggedIn()
    ) {

    <a
      mat-button
      routerLink="/dashboard">
      Dashboard
    </a>

    <a
      mat-button
      routerLink="/students">
      Students
    </a>

    @if (
      authService.isAdmin()
      ) {

      <a
        mat-button
        routerLink="/add-student">
        Add Student
      </a>

    }

  }

  <a
    mat-button
    routerLink="/about">
    About
  </a>

  @if (
    !authService.isLoggedIn()
    ) {

    <a
      mat-button
      routerLink="/login">
      Sign In
    </a>

  }

  @if (
    authService.isLoggedIn()
    ) {

    <span
      class="user-info">

      {{ authService.getUsername() }}

      (
      {{ authService.getRole() }}
      )

    </span>

    <button
      mat-button
      type="button"
      (click)="logout()">

      Logout

    </button>

  }

</mat-toolbar>

<main class="page-content">

  <router-outlet>
  </router-outlet>

</main>
