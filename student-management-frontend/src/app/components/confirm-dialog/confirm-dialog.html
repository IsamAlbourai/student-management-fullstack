<h2 mat-dialog-title>
  Delete Student
</h2>

<mat-dialog-content>

  <p>
    Are you sure you want to delete
    <strong>{{ data.studentName }}</strong>?
  </p>

  <p>
    This action cannot be undone.
  </p>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    [mat-dialog-close]="false">
    Cancel
  </button>

  <button
    mat-flat-button
    type="button"
    [mat-dialog-close]="true">
    Delete
  </button>

</mat-dialog-actions>
