<div class="student-card">

  <h3>
    {{ student.name }}
  </h3>

  <p>
    <strong>ID:</strong>
    {{ student.id }}
  </p>

  <p>
    <strong>Age:</strong>
    {{ student.age }}
  </p>

  <p>
    <strong>Course:</strong>
    {{ student.course }}
  </p>

  <p>
    <strong>Department:</strong>
    {{ student.departmentName }}
  </p>

  <button
    type="button"
    (click)="requestDelete()">

    Delete Student

  </button>

</div>
