<div class="login-page">

  <mat-card class="login-card">

    <mat-card-header>

      <mat-card-title>
        Sign In
      </mat-card-title>

      <mat-card-subtitle>
        Student Management System
      </mat-card-subtitle>

    </mat-card-header>

    <mat-card-content>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="login()">

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>
            Username
          </mat-label>

          <input
            matInput
            type="text"
            formControlName="username">

          <mat-error
            *ngIf="
              loginForm
                .get('username')
                ?.hasError('required')
            ">

            Username is required

          </mat-error>

        </mat-form-field>

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>
            Password
          </mat-label>

          <input
            matInput
            type="password"
            formControlName="password">

          <mat-error
            *ngIf="
              loginForm
                .get('password')
                ?.hasError('required')
            ">

            Password is required

          </mat-error>

        </mat-form-field>

        <div
          *ngIf="errorMessage()"
          class="error-message">

          {{ errorMessage() }}

        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="loading()">

          <span *ngIf="!loading()">
            Sign In
          </span>

          <mat-spinner
            *ngIf="loading()"
            diameter="24">
          </mat-spinner>

        </button>

      </form>

    </mat-card-content>

  </mat-card>

</div>
