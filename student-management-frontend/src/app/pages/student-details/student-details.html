<h2>Student Details</h2>

@if (isLoading()) {

  <p>Loading student details...</p>

} @else if (errorMessage()) {

  <p>{{ errorMessage() }}</p>

} @else if (student(); as selectedStudent) {

  <app-student-card
    [student]="selectedStudent"
    (deleteRequested)="deleteStudent($event)">
  </app-student-card>

}

<br>

<a routerLink="/students">
  Back to Students
</a>
